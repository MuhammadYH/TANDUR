<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — Admin Tandur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script src="vendor/chart.umd.js"></script>
</head>
<body>
<div class="admin-scrim" id="scrim"></div>
<div class="admin-shell">

  <aside class="admin-sidebar" id="sidebar">
    <div class="admin-logo">
      <img src="../assets/logo/tandur.png" alt="Tandur">
      <div><div class="lbl">Admin</div></div>
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html" class="active">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Dashboard
      </a>
      <a href="riwayat-timbang.html">
        <svg viewBox="0 0 24 24"><path d="M4 19h16"/><rect x="6" y="10" width="3" height="9" rx="0.5"/><rect x="10.5" y="6" width="3" height="13" rx="0.5"/><rect x="15" y="13" width="3" height="6" rx="0.5"/></svg>
        Riwayat Timbang
      </a>
    </nav>
    <div class="admin-side-foot">
      <div class="admin-user">
        <strong>Mode MVP</strong>
        <span>Akses langsung — tanpa login</span>
      </div>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="admin-menu-btn" id="menuBtn" aria-label="Buka menu">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
        </button>
        <div>
          <h1>Dashboard</h1>
          <div class="sub">Ringkasan pengumpulan limbah dari seluruh kelompok tani</div>
        </div>
      </div>
    </div>

    <div class="admin-content" id="content">
      <div class="admin-loading" id="loading">Memuat data…</div>
    </div>
  </main>

</div>

<script type="module">
import { getDashboardStats, getSetoranTrend } from './admin-data.js';

const content = document.getElementById('content');
const loading = document.getElementById('loading');

// ---------- sidebar toggle (mobile) ----------
const sidebar = document.getElementById('sidebar');
const scrim = document.getElementById('scrim');
document.getElementById('menuBtn').addEventListener('click', () => {
  sidebar.classList.add('open'); scrim.classList.add('open');
});
scrim.addEventListener('click', () => {
  sidebar.classList.remove('open'); scrim.classList.remove('open');
});

// ---------- akses langsung (MVP, tanpa login) ----------
init();

function fmtKg(n){
  return Number(n).toLocaleString('id-ID', { maximumFractionDigits: 1 });
}
function fmtDate(d){
  if (!d) return '—';
  return new Intl.DateTimeFormat('id-ID', { day:'2-digit', month:'short', year:'numeric' }).format(new Date(d));
}

async function init(){
  const stats = await getDashboardStats();
  loading.remove();

  const statGrid = document.createElement('div');
  statGrid.className = 'stat-grid';
  statGrid.innerHTML = `
    <div class="stat-card featured">
      <span class="tag">Sepanjang waktu</span>
      <div class="lbl">Total limbah terkumpul</div>
      <div class="val">${fmtKg(stats.totalKg)}<small>kg</small></div>
    </div>
    <div class="stat-card">
      <div class="lbl">Kelompok tani</div>
      <div class="val">${stats.totalKelompok}</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Petani terdaftar</div>
      <div class="val">${stats.totalPetani}</div>
    </div>
  `;
  content.appendChild(statGrid);

  const panelRow = document.createElement('div');
  panelRow.className = 'panel-row';

  // ---- panel: kelompok tani teratas ----
  const topPanel = document.createElement('div');
  topPanel.className = 'panel';
  if (stats.topKelompok.length === 0) {
    topPanel.innerHTML = `
      <h2>Kelompok Tani Teratas</h2>
      <div class="ph-sub">Berdasarkan total limbah terkumpul</div>
      <div class="empty-state">Belum ada data kelompok tani.</div>
    `;
  } else {
    const maxKg = Math.max(...stats.topKelompok.map(k => k.totalKg), 1);
    const rows = stats.topKelompok.map((k, i) => `
      <div class="rank-row">
        <span class="n">${i + 1}</span>
        <span class="name">${escapeHtml(k.nama)}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${(k.totalKg / maxKg * 100).toFixed(1)}%"></span></span>
        <span class="kg">${fmtKg(k.totalKg)} kg</span>
      </div>
    `).join('');
    topPanel.innerHTML = `
      <h2>Kelompok Tani Teratas</h2>
      <div class="ph-sub">Berdasarkan total limbah terkumpul</div>
      ${rows}
    `;
  }
  panelRow.appendChild(topPanel);

  // ---- panel: setoran terbaru ----
  const recentPanel = document.createElement('div');
  recentPanel.className = 'panel';
  if (stats.recentSetoran.length === 0) {
    recentPanel.innerHTML = `
      <h2>Setoran Terbaru</h2>
      <div class="ph-sub">6 setoran limbah paling baru dicatat</div>
      <div class="empty-state">Belum ada setoran tercatat.</div>
    `;
  } else {
    const rows = stats.recentSetoran.map(s => `
      <div class="recent-row">
        <span>${escapeHtml(s.namaPetani)}<div class="grp">${escapeHtml(s.namaKelompok)}</div></span>
        <span class="dt">${fmtDate(s.tanggal)}</span>
        <span class="kg">${fmtKg(s.beratKg)} kg</span>
      </div>
    `).join('');
    recentPanel.innerHTML = `
      <h2>Setoran Terbaru</h2>
      <div class="ph-sub">6 setoran limbah paling baru dicatat</div>
      ${rows}
    `;
  }
  panelRow.appendChild(recentPanel);

  content.appendChild(panelRow);

  // ---- panel: tren setoran (grafik) ----
  const trendPanel = document.createElement('div');
  trendPanel.className = 'panel';
  trendPanel.innerHTML = `
    <h2>Tren Setoran</h2>
    <div class="ph-sub">Total limbah masuk per hari, 14 hari terakhir</div>
    <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
  `;
  content.appendChild(trendPanel);

  const trend = await getSetoranTrend(14);
  renderTrendChart(trend);
}

function renderTrendChart(trend){
  const hasData = trend.data.some(v => v > 0);
  if (!hasData) {
    document.querySelector('.chart-wrap').outerHTML = '<div class="empty-state">Belum ada setoran dalam 14 hari terakhir.</div>';
    return;
  }
  const labels = trend.labels.map(d =>
    new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short' }).format(new Date(d + 'T00:00:00'))
  );
  const ctx = document.getElementById('trendChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Kg per hari',
        data: trend.data,
        borderColor: '#2E9C4B',
        backgroundColor: 'rgba(46,156,75,0.12)',
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointBackgroundColor: '#2E9C4B',
        tension: 0.25,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0E3A63',
          titleFont: { family: 'IBM Plex Mono', size: 11 },
          bodyFont: { family: 'IBM Plex Mono', size: 12 },
          padding: 10,
          displayColors: false,
          callbacks: {
            label: (item) => item.parsed.y.toLocaleString('id-ID') + ' kg'
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { family: 'IBM Plex Mono', size: 10.5 }, color: 'rgba(27,23,16,0.55)', maxRotation: 0 }
        },
        y: {
          beginAtZero: true,
          grid: { color: 'rgba(27,23,16,0.08)' },
          ticks: { font: { family: 'IBM Plex Mono', size: 10.5 }, color: 'rgba(27,23,16,0.55)' }
        }
      }
    }
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
