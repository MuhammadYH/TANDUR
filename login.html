<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Masuk Admin — Tandur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3E9; --card:#FFFFFF; --ink:#1B1710; --navy:#0E3A63; --navy-deep:#0A2C4C;
    --kraft:#2E9C4B; --soil:#B8791F;
    --line: rgba(27,23,16,0.15); --line-strong: rgba(27,23,16,0.3); --muted: rgba(27,23,16,0.55);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(246,243,233,0.04) 7px, rgba(246,243,233,0.04) 8px),
      linear-gradient(160deg, var(--navy), var(--navy-deep) 80%);
    color:var(--ink); font-family:'IBM Plex Sans', sans-serif;
    padding:24px;
  }
  :focus-visible{ outline:2px solid var(--kraft); outline-offset:2px; }
  .card{
    width:100%; max-width:380px; background:var(--card); border-radius:4px;
    padding:32px 30px 26px; position:relative;
    box-shadow:0 18px 40px rgba(10,44,76,0.28);
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background-image: radial-gradient(circle, var(--paper) 2.4px, transparent 2.5px);
    background-size: 13px 13px; background-position: 7px 0;
    background-color: var(--card);
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:26px; }
  .brand img{ height:24px; width:auto; }
  .brand .tag{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.08em;
    color:var(--muted); border-left:1px solid var(--line-strong); padding-left:10px;
  }
  h1{ font-family:'Big Shoulders Display', sans-serif; font-size:25px; letter-spacing:0.005em; margin-bottom:5px; color:var(--navy); }
  .sub{ font-size:13px; color:var(--muted); margin-bottom:26px; max-width:30ch; }
  label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink); }
  .field{ margin-bottom:16px; }
  input{
    width:100%; padding:11px 13px; border:1px solid var(--line-strong); border-radius:3px;
    font-family:'IBM Plex Sans',sans-serif; font-size:14px; background:#fff; color:var(--ink);
  }
  input:focus{ outline:2px solid var(--kraft); outline-offset:1px; border-color:var(--kraft); }
  .btn{
    width:100%; padding:12px; border:none; border-radius:3px; background:var(--navy); color:#fff;
    font-size:14px; font-weight:700; cursor:pointer; margin-top:6px; letter-spacing:0.01em;
  }
  .btn:hover{ background:var(--navy-deep); }
  .btn:disabled{ opacity:0.6; cursor:default; }
  .msg{ font-size:12.5px; padding:10px 12px; border-radius:3px; margin-bottom:16px; display:none; border-left:3px solid transparent; }
  .msg.show{ display:block; }
  .msg.err{ background:rgba(178,58,58,0.08); color:#9A2E2E; border-left-color:#B23A3A; }
  .msg.info{ background:rgba(14,58,99,0.07); color:var(--navy); border-left-color:var(--navy); }
  .foot-note{ font-size:11px; color:var(--muted); margin-top:22px; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../assets/logo/tandur.png" alt="Tandur">
      <span class="tag">Admin</span>
    </div>
    <h1>Masuk Admin</h1>
    <p class="sub">Khusus tim internal Tandur untuk memantau data pengumpulan limbah.</p>

    <div class="msg" id="msgBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Masuk</button>
    </form>

    <p class="foot-note">Halaman ini tidak diindeks dan tidak tertaut dari situs utama.</p>
  </div>

<script type="module">
import { supabase } from '../supabase-client.js';

const msgBox = document.getElementById('msgBox');
const form = document.getElementById('loginForm');
const submitBtn = document.getElementById('submitBtn');

function showMsg(text, type){
  msgBox.textContent = text;
  msgBox.className = 'msg show ' + type;
}

// Kalau lewat query ?msg= (misalnya dilempar balik dari dashboard karena
// bukan admin), tampilkan pesannya di sini.
const params = new URLSearchParams(window.location.search);
if (params.get('msg')) showMsg(params.get('msg'), 'err');

// Kalau sudah ada sesi admin yang valid, langsung lompat ke dashboard —
// tidak perlu login ulang.
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return;
  const { data: profile } = await supabase
    .from('profiles').select('role').eq('id', session.user.id).single();
  if (profile?.role === 'ops_admin') window.location.href = 'dashboard.html';
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Memeriksa…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error || !data.session) {
    showMsg('Email atau kata sandi salah.', 'err');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Masuk';
    return;
  }

  const { data: profile, error: profileErr } = await supabase
    .from('profiles').select('role').eq('id', data.session.user.id).single();

  if (profileErr || !profile || profile.role !== 'ops_admin') {
    await supabase.auth.signOut();
    showMsg('Akun ini tidak memiliki akses admin.', 'err');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Masuk';
    return;
  }

  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
